[package]
name = "guitar-trainer"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3

# theory code runs often in the UI; keep debug builds responsive
[profile.dev.package."*"]
opt-level = 2
